[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "daily-leetcode"
version = "1.0.0"
description = "Generate bilingual LeetCode solution notes with historical git commits"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "tqdm>=4.66.0",
]

[tool.setuptools]
py-modules = ["config", "llm", "prompts", "committer", "main"]
